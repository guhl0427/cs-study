name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装内容工具链依赖
        run: pnpm install --frozen-lockfile

      - name: 内容校验 + 构建期编译 + sitemap
        run: pnpm content:build -- --site https://guhl0427.github.io/cs-study/

      - name: 安装前端依赖
        run: pnpm -C frontend install --frozen-lockfile

      - name: SSG 构建（GitHub Pages 项目页 base）
        run: pnpm -C frontend build
        env:
          VITE_BASE: /cs-study/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4
